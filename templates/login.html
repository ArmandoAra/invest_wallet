{% extends "layout.html" %}

{% block title %}Entrar | Invest Wallet{% endblock %}

{% block head %}
<style>
    /* 
      Sobrescribimos los colores del body solo para esta vista, 
      pero evitamos meterle flexbox al body para no romper el layout padre.
    */
    body {
        background-color: #020b14 !important;
        color: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Nuevo contenedor de pantalla completa exclusivo para centrar el login */
    .login-fullscreen-container {
        display: flex;
        align-items: center;
        justify-content: center;
        /* Restamos un margen hipotético si el layout padre tuviera padding, aunque aquí 100vh es seguro */
        min-height: 100vh; 
        padding: 2rem;
    }

    .login-wrapper {
        width: 100%;
        max-width: 360px;
    }

    .brand-title {
        font-size: 1.85rem;
        font-weight: 300;
        letter-spacing: -0.5px;
        margin-bottom: 3rem;
        text-align: center;
        color: #ffffff;
    }

    .input-group-minimal {
        margin-bottom: 2rem;
        position: relative;
    }

    .label-minimal {
        display: block;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        color: #64748b;
        margin-bottom: 0.5rem;
        font-weight: 600;
    }

    .form-control-minimal {
        width: 100%;
        background: transparent;
        border: none;
        border-bottom: 2px solid #1e293b;
        color: #f8fafc;
        font-size: 1rem;
        padding: 0.5rem 0;
        transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .form-control-minimal:focus {
        outline: none;
        border-bottom-color: #3b82f6;
        box-shadow: 0 4px 6px -6px #3b82f6; 
    }

    .form-control-minimal:-webkit-autofill {
        -webkit-box-shadow: 0 0 0 30px #020b14 inset !important;
        -webkit-text-fill-color: #f8fafc !important;
    }

    .btn-minimal {
        background-color: #f8fafc;
        color: #020b14;
        border: none;
        border-radius: 4px;
        padding: 0.85rem;
        font-weight: 600;
        letter-spacing: 0.5px;
        transition: transform 0.2s ease, background-color 0.2s ease;
        width: 100%;
    }

    .btn-minimal:hover, .btn-minimal:focus {
        background-color: #cbd5e1;
        transform: translateY(-2px);
    }

    .btn-minimal:focus-visible {
        outline: 2px solid #3b82f6;
        outline-offset: 4px;
    }

    .link-minimal {
        color: #64748b;
        text-decoration: none;
        font-size: 0.875rem;
        transition: color 0.2s ease;
    }

    .link-minimal:hover {
        color: #ffffff;
    }
</style>
{% endblock %}

{% block content %}
<!-- Usamos un div genérico en lugar de 'main' para respetar la estructura de layout.html -->
<div class="login-fullscreen-container">
    <div class="login-wrapper">
        <h1 class="brand-title">Invest Wallet</h1>

        {% if let Some(error) = error_message %}
        <div class="alert bg-transparent border border-danger text-danger text-center p-2 mb-4" role="alert" aria-live="polite">
            {{ error }}
        </div>
        {% endif %}

        <form action="/login" method="POST" novalidate>
            
            <div class="input-group-minimal">
                <label for="username" class="label-minimal">Usuário</label>
                <input type="text" id="username" name="username" class="form-control-minimal" required aria-required="true" autocomplete="username">
            </div>
            
            <div class="input-group-minimal">
                <label for="password" class="label-minimal">Senha</label>
                <input type="password" id="password" name="password" class="form-control-minimal" required aria-required="true" autocomplete="current-password">
            </div>

            <button class="btn btn-minimal mt-3 mb-5" type="submit">Entrar</button>
        </form>
    </div>
</div>
{% endblock %}
