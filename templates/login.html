<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Pequeño ajuste para centrar la tarjeta en toda la pantalla */
        body {
            display: flex;
            align-items: center;
            padding-top: 40px;
            padding-bottom: 40px;
            background-color: #031527;
            height: 100vh;
        }
        .form-signin {
            max-width: 400px;
            padding: 15px;
        }
    </style>
</head>
<body>
    <main class="form-signin w-100 m-auto">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4 p-md-5">
                <h2 class="text-center mb-4 fw-bold">Bienvenido</h2>
                
                <!-- Askama condicional: Si pasas un error desde Rust, se renderiza aquí -->
                {% if let Some(error) = error_message %}
                <div class="alert alert-danger" role="alert">
                    {{ error }}
                </div>
                {% endif %}

                <!-- Asegúrate de que el action coincida con tu endpoint de validación en Axum -->
                <form action="/login" method="POST">
                    
                    <div class="form-floating mb-3">
                        <!-- El name="username" es clave para que Axum lo parsee en tu DTO -->
                        <input type="text" class="form-control" id="username" name="username" placeholder="Tu usuario" required autofocus>
                        <label for="username">Usuario</label>
                    </div>
                    
                    <div class="form-floating mb-4">
                        <!-- El name="password" debe coincidir con tu struct de deserialización -->
                        <input type="password" class="form-control" id="password" name="password" placeholder="Contraseña" required>
                        <label for="password">Contraseña</label>
                    </div>

                    <button class="btn btn-primary w-100 py-2 fs-5" type="submit">Iniciar Sesión</button>
                </form>

                <div class="text-center mt-4">
                    <p class="text-muted mb-0">¿No tienes cuenta? <a href="/register" class="text-decoration-none fw-semibold">Regístrate aquí</a></p>
                </div>
            </div>
        </div>
    </main>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
